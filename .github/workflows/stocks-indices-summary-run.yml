name: Stocks Indices Summary Run

on:
  schedule:
    # - cron: "0 * * * 1-5"
    - cron: "15 20 * * 1-5"
  workflow_dispatch:
    inputs:
      summary_type:
        description: "Summary mode to generate"
        required: true
        default: intraday
        type: choice
        options:
          - intraday
          - final

concurrency:
  group: stocks-indices-summary-run-${{ github.event.schedule || github.event.inputs.summary_type || 'manual' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Resolve summary mode
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            summary_type="${{ github.event.inputs.summary_type }}"
          elif [ "${{ github.event.schedule }}" = "15 20 * * 1-5" ]; then
            summary_type="final"
          else
            summary_type="intraday"
          fi

          echo "summary_type=${summary_type}" >> "${GITHUB_OUTPUT}"
          echo "Resolved summary_type=${summary_type}"

      - name: Trigger market indices summary
        env:
          STOCKS_API_BASE_URL: ${{ secrets.STOCKS_API_BASE_URL }}
          STOCKS_ADMIN_TOKEN: ${{ secrets.STOCKS_ADMIN_TOKEN }}
          SUMMARY_TYPE: ${{ steps.resolve.outputs.summary_type }}
        run: |
          set -euo pipefail

          if [ -z "${STOCKS_API_BASE_URL:-}" ]; then
            echo "Missing secret: STOCKS_API_BASE_URL"
            exit 1
          fi
          if [ -z "${STOCKS_ADMIN_TOKEN:-}" ]; then
            echo "Missing secret: STOCKS_ADMIN_TOKEN"
            exit 1
          fi
          if [ -z "${SUMMARY_TYPE:-}" ]; then
            echo "Missing summary type."
            exit 1
          fi

          endpoint="${STOCKS_API_BASE_URL%/}/api/v1/stocks/indices/admin/run?summaryType=${SUMMARY_TYPE}"
          echo "Triggering (${SUMMARY_TYPE}): ${endpoint}"

          attempt=1
          max_attempts=3
          while [ "${attempt}" -le "${max_attempts}" ]; do
            echo "Attempt ${attempt}/${max_attempts}"
            response="$(curl -sS -m 180 -w '\n%{http_code}' -H "x-admin-token: ${STOCKS_ADMIN_TOKEN}" "${endpoint}")"
            status_code="$(printf '%s\n' "${response}" | tail -n1)"
            response_body="$(printf '%s\n' "${response}" | sed '$d')"

            echo "HTTP ${status_code}"
            echo "${response_body}"

            if [ "${status_code}" -ge 200 ] && [ "${status_code}" -lt 300 ]; then
              echo "Market indices ${SUMMARY_TYPE} summary completed."
              exit 0
            fi

            attempt=$((attempt + 1))
            sleep 8
          done

          echo "Market indices ${SUMMARY_TYPE} summary failed after retries."
          exit 1
