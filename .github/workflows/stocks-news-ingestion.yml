name: Stocks News Ingestion

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: stocks-news-ingestion
  cancel-in-progress: false

jobs:
  import-news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Install Dependencies
        run: bun install

      - name: Install Chromium Runtime
        run: bunx playwright install --with-deps chromium

      - name: Crawl and Import Stocks News
        env:
          STOCKS_API_BASE_URL: ${{ secrets.STOCKS_API_BASE_URL }}
          STOCKS_ADMIN_TOKEN: ${{ secrets.STOCKS_ADMIN_TOKEN }}
        run: bun scripts/stocks-news-crawl-import.mjs
