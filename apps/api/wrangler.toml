name = "china-stocks-daily-worker"
main = "src/index.ts"
compatibility_date = "2026-03-05"
compatibility_flags = ["nodejs_compat"]
account_id = "5697c41d4efbabcbac78eafe2cdf036b"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[d1_databases]]
binding = "STOCKS_DB"
database_name = "china-stocks-daily"
database_id = "8db1c9cb-c3a9-4093-aa0e-36142c0a773b"

[[d1_databases]]
binding = "CRYPTO_DB"
database_name = "crypto-daily"
database_id = "21a1a3a0-bd0b-44a7-88e1-272430fe8ca0"

[[r2_buckets]]
binding = "SCHEDULER_STATUS_BUCKET"
bucket_name = "china-stocks-daily-scheduler-status"

[ai]
binding = "CRYPTO_AI"

[vars]
STOCKS_WEBHOOK_URL = ""
STOCKS_OPENAI_BASE_URL = ""
STOCKS_OPENAI_API_KEY = ""
STOCKS_AI_MODEL = "gpt-5.2"
STOCKS_NEWS_BODY_FETCH_ENABLED = "true"
STOCKS_NEWS_BODY_PER_STOCK_LIMIT = "2"
STOCKS_NEWS_BODY_TIMEOUT_MS = "4500"
STOCKS_NEWS_BODY_MAX_CHARS = "900"
STOCKS_AI_GATEWAY_BASE_URL = ""
STOCKS_AI_API_KEY = ""
